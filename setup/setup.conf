# spf-datto replica setup: configuration
# Sourced by setup.sh. Every value has a working default; edit only what you need.

# User who logs in over SSH. Added to remote-users, because Datto's sshd config only
# allows that group. Empty = the user who ran sudo.
LOGIN_USER=""

# ---- Network: NetworkManager bridge br0, like spf-datto -------------------------
NET_CONFIGURE=yes
# "current" = keep the address the VM has right now, made static (safest: SSH stays up)
# "dhcp"    = DHCP on br0 (what spf-datto does); the bridge clones the NIC's MAC, so the lease is the same
# "10.0.3.200/24" = a specific static address (your SSH session drops; reconnect on the new IP)
NET_IP="current"
NET_GATEWAY=""          # empty = current default gateway; "none" = do not configure a default route
NET_DNS=""              # empty = current DNS/fallback gateway; "none" = do not configure DNS
NET_IFACE=""            # empty = default-route interface, or first interface with a global IPv4

# ---- Protection engine -------------------------------------------------------------
# Agentless VM protection uses libguestfs/QEMU and requires hardware virtualization.
# When this appliance itself is a VM, expose nested virtualization in the hypervisor.
REQUIRE_KVM=yes

# ---- ZFS: homePool with spf-datto's dataset layout --------------------------------
# A homePool is required for the dashboard, backup storage, and full application use.
# "yes" requires a suitable blank second disk. "auto" and "no" are intended only
# for troubleshooting incomplete/non-production installs.
ZFS_CONFIGURE=yes
ZFS_DISK="auto"         # "auto" = the largest BLANK disk >= ZFS_MIN_GB; or e.g. /dev/sdb
ZFS_MIN_GB=20
ZFS_POOL="homePool"
ZFS_MOVE_HOME=yes       # put /home on homePool/home (copied first; the original stays underneath)

# ---- Boot / cleanup ---------------------------------------------------------------
FIPS_OFF=yes            # boot the 6.8 generic kernel without fips=1, like spf-datto
REMOVE_SNAPD=yes        # snapd + cloud-init cause boot ordering cycles with Datto's units
REMOVE_CLOUD_INIT=yes

# ---- Apt ----------------------------------------------------------------------------
# yes = package operations run in a private network namespace and can use only the
#       bundled file: repository. This is the supported/default installation mode.
# no  = do not add network isolation (intended only for troubleshooting).
OFFLINE_MODE=yes

# yes = keep the replica at spf-datto's exact versions: Ubuntu sources are disabled
#       (backed up) and apt's daily timers / unattended-upgrades are turned off.
#       spf-datto itself is frozen to Datto's snapshot. NOTE: no security updates.
# no  = leave Ubuntu sources on; unattended-upgrades will move packages past spf-datto's versions.
# OFFLINE_MODE=yes requires this setting to remain yes.
APT_FREEZE=yes

# Reboot automatically at the end. A verification runs 3 minutes after that boot:
#   /var/log/spf-datto-verify.log
AUTO_REBOOT=yes
