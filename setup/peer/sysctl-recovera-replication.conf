# Recovera appliance-to-appliance replication runs over WAN links that can be
# lossy with high latency. Linux's default CUBIC congestion control collapses
# its window on such paths (measured ~100 KB/s on a 133 ms, 0.7%-loss link);
# BBR sustains the available bandwidth (~3.4 MB/s on the same link).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
