# Public Recovera pairing gateway. Only the two bootstrap endpoints are exposed;
# replication control and data remain on the restricted SSH transport.
SSLProxyEngine On
SSLProxyVerify none
SSLProxyCheckPeerCN off
SSLProxyCheckPeerName off

ProxyPass        /recovera-peer/info https://127.0.0.1:9443/v1/info retry=0 timeout=20
ProxyPassReverse /recovera-peer/info https://127.0.0.1:9443/v1/info
ProxyPass        /recovera-peer/pair https://127.0.0.1:9443/v1/pair retry=0 timeout=20
ProxyPassReverse /recovera-peer/pair https://127.0.0.1:9443/v1/pair

<LocationMatch "^/recovera-peer/(?:info|pair)$">
    Require all granted
</LocationMatch>
