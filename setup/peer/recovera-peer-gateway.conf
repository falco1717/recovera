# Public Recovera pairing gateway. Only the two bootstrap endpoints are exposed;
# replication control and data remain on the restricted SSH transport.
ProxyPass        /recovera-peer/info unix:/run/recovera-peer/http.sock|http://localhost/v1/info retry=0 timeout=20
ProxyPassReverse /recovera-peer/info unix:/run/recovera-peer/http.sock|http://localhost/v1/info
ProxyPass        /recovera-peer/pair unix:/run/recovera-peer/http.sock|http://localhost/v1/pair retry=0 timeout=20
ProxyPassReverse /recovera-peer/pair unix:/run/recovera-peer/http.sock|http://localhost/v1/pair

<LocationMatch "^/recovera-peer/(?:info|pair)$">
    Require all granted
</LocationMatch>
