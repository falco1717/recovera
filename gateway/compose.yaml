services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      RECOVERA_GATEWAY_BIND: 0.0.0.0
      RECOVERA_GATEWAY_PORT: 8080
      RECOVERA_GATEWAY_REPOSITORY: ${RECOVERA_GATEWAY_REPOSITORY:-falco1717/recovera}
      RECOVERA_GATEWAY_CHANNELS: ${RECOVERA_GATEWAY_CHANNELS:-stable}
      RECOVERA_GATEWAY_SYNC_INTERVAL: ${RECOVERA_GATEWAY_SYNC_INTERVAL:-900}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - gateway-cache:/var/lib/recovera-gateway
      - ./config/github-token:/run/secrets/github-token:ro
      - ./config/access-signers:/etc/recovera-gateway/access-signers:ro
      - ../upgrade/keys/recovera-release-signers:/etc/recovera-gateway/release-signers:ro
      - ./config/revocations.json:/etc/recovera-gateway/revocations.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:?set GATEWAY_HOSTNAME}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gateway-cache:
  caddy-data:
  caddy-config:
