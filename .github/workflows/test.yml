name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          bash -n install.sh setup/setup.sh tests/e2e-recovera-peer.sh \
            gateway/install.sh gateway/install-saltbox.sh \
            tools/build-package-release.sh tools/build-recovera-appliance-deb.sh \
            tools/publish-package-release.sh tools/make-bundle.sh
          php -l setup/branding/RecoveraTargetController.php
          php -l tests/integration_recovera_auth.php
          python3 -m py_compile setup/peer/recovera-peer setup/branding/apply-branding.py \
            setup/branding/apply-peer-ui.py \
            setup/isolation/recovera-cloud-isolation \
            upgrade/recovera-upgrade \
            gateway/recovera-gateway gateway/recovera-gateway-token \
            gateway/recovera_gateway_auth.py \
            tools/verify-release.py \
            tools/merge-offline-package.py \
            tools/compatibility/collect-baseline.py \
            tools/compatibility/compare-baselines.py
          RECOVERA_GATEWAY_TRAEFIK_RULE='Host(`gateway.example.com`)' \
            docker compose -f gateway/compose.saltbox.yaml config --quiet
      - name: Build package update fixtures
        run: |
          bash tools/build-recovera-appliance-deb.sh \
            --version "$(tr -d '[:space:]' < VERSION)-1" --output /tmp/recovera-debs
          test "$(dpkg-deb -f /tmp/recovera-debs/recovera-appliance_*_all.deb Package)" = recovera-appliance
          (cd /tmp/recovera-debs && \
            dpkg-scanpackages -m . /dev/null > Packages && \
            gzip -9c Packages > Packages.gz && \
            sha256sum recovera-appliance_*_all.deb Packages Packages.gz > SHA256SUMS)
          bash tools/build-package-release.sh \
            --packages /tmp/recovera-debs --version 0.6.1 --sequence 1 \
            --output /tmp/recovera-package-release
          python3 -c 'import json; p=json.load(open("/tmp/recovera-package-release/recovera-package-manifest.json")); assert p["schema"] == 2 and p["type"] == "package" and len(p["packages"]) == 1'
      - name: Preserve tested appliance package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: recovera-appliance-${{ github.sha }}
          path: |
            /tmp/recovera-debs/recovera-appliance_*_all.deb
            /tmp/recovera-debs/Packages
            /tmp/recovera-debs/Packages.gz
            /tmp/recovera-debs/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
