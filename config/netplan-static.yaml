# /etc/netplan/50-cloud-init.yaml as used between first boot and the NetworkManager switch.
# Replaced by br0.nmconnection + ens192.nmconnection in the final state (netplan dir is empty there).
network:
  version: 2
  ethernets:
    ens192:
      match:
        macaddress: "00:50:56:9a:b6:f7"
      set-name: "ens192"
      dhcp4: false
      dhcp6: false
      addresses: [10.0.3.200/24]
      routes:
        - to: default
          via: 10.0.3.1
      nameservers:
        addresses: [10.0.3.1]
