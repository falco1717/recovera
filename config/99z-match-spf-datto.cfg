# /etc/default/grub.d/99z-match-spf-datto.cfg
# Match spf-datto, which boots the 6.8 HWE generic kernel with FIPS off.
# The ubuntu-fips packages stay installed; this only overrides their GRUB defaults.
# The name sorts after 99-fips.cfg and 99-ubuntu-fips.cfg, so it wins.
GRUB_FLAVOUR_ORDER="generic"
GRUB_CMDLINE_LINUX_DEFAULT="$(echo "$GRUB_CMDLINE_LINUX_DEFAULT" | sed "s/ *fips=1//g")"
