# Recovera signed package/image update configuration.
REPOSITORY=falco1717/recovera
CHANNEL=stable
CHANNEL_BRANCH=main
TOKEN_FILE=/etc/recovera/github-token
# Comma-separated active-active update gateways, tried in order. They are used
# once a gateway access token is installed (GATEWAY_TOKEN_FILE); until then the
# appliance updates from GitHub directly.
UPDATE_ORIGINS=https://recoveragw.rjproductionsut.com
GATEWAY_TOKEN_FILE=/etc/recovera/gateway-token
HOST_ROOT=/host
PACKAGE_CACHE=/var/cache/recovera-upgrade/packages
TRANSACTION_ROOT=/var/lib/recovera-upgrade/transactions
AUTO_DOWNLOAD=no
AUTO_INSTALL=no
# php-fpm.service means whichever phpX.Y-fpm unit is installed.
REQUIRED_SERVICES=apache2.service php-fpm.service recovera-peer.service
REQUIRE_BASELINE_PACKAGES=recovera-appliance
# Opt-in operating-system upgrade channel (installed only after an administrator
# approves it on the appliance's Update page).
TRANSITION_CHANNEL=jammy-noble-transition
